apiVersion: v1
kind: Plugin
metadata:
  author: pc
  name: DocToWeKnora
  label:
    zh_Hans: 飞书文档入库 WeKnora
    en_US: Feishu Doc to WeKnora
  version: 0.1.1
  description:
    zh_Hans: 监听文件消息，自动下载并入库到指定 WeKnora 知识库（支持飞书等平台）
    en_US: Listen file messages from any platform and ingest into a WeKnora knowledge base
  icon: assets/icon.svg
spec:
  config:
  - name: weknora_base_url
    type: string
    label:
      zh_Hans: WeKnora 地址
    default: http://WeKnora-app:8088
    required: true
  - name: weknora_api_key
    type: string
    label:
      zh_Hans: WeKnora API Key
    default: ''
    required: true
  components:
    Runner:
      fromDirs:
      - path: components/runner/
  pages: []
execution:
  python:
    path: main.py
    attr: DocToWeKnoraPlugin
  sharedRuntime: shared-runtime-v1
  componentModel: stateless-v1
